{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="overlay"></div>
<div class="container mt-4">
    <div class="row">
        <div class="col">
            <h1 class="text-navy-dark">Products</h1>
        </div>
    </div>
    <div class="row">
        {% for product in products %}
        <div class="col-12 col-md-4 mb-4">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.description }}</p>
                    <p class="card-text"><strong>SEK {{ product.price_per_day }}/day</strong></p>
                    <a href="{% url 'product_detail' product.id %}" class="btn btn-card mt-auto">View Details</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col">
            <p class="text-dark">No products found.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
