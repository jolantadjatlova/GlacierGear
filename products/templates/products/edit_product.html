{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}
 
{% block extra_title %}Edit {{ product.name }}{% endblock %}
 
{% block content %}
<div class="overlay"></div>
<div class="container py-5" style="position: relative; z-index: 2;">
    <div class="row">
        <div class="col">
            <h2 class="mb-4 products-title">Product Management</h2>
            <hr>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card p-4">
                <div class="card-body">
                    <h5 class="card-title mb-1">Edit Product</h5>
                    <p class="text-muted small mb-4">
                        You are editing <strong>{{ product.name }}</strong>
                    </p>
                    <form method="POST"
                          action="{% url 'edit_product' product.id %}"
                          enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'product_detail' product.id %}"
                               class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-dark">
                                <i class="bi bi-pencil me-1"></i>Update Product
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
