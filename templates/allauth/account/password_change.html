{% extends "base.html" %}
{% load i18n %}
{% load crispy_forms_tags %}
 
{% block extra_title %}Change Password{% endblock %}
 
{% block content %}
<div class="overlay"></div>
<div class="container" style="position: relative; z-index: 2;">
    <div class="row justify-content-center mt-5">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-4">
                <div class="card-body">
                    <h2 class="card-title text-center mb-1">Change Password</h2>
                    <p class="text-center mb-4" style="color: var(--navy-dark); font-size: 0.9rem;">
                        Enter your current and new password below.
                    </p>
                    <hr>
                    <form method="POST" action="{% url 'account_change_password' %}">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button class="btn btn-card w-100 mt-2" type="submit" name="action">
                            Change Password
                        </button>
                    </form>
                    <hr>
                    <p class="text-center mt-3 mb-0" style="color: var(--navy-dark); font-size: 0.9rem;">
                        <a href="{% url 'account_reset_password' %}" style="color: var(--navy);">
                            Forgot Password?
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
