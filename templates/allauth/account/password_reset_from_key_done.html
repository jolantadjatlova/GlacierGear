{% extends "base.html" %}
{% load i18n %}
 
{% block extra_title %}Password Changed{% endblock %}
 
{% block content %}
<div class="overlay"></div>
<div class="container" style="position: relative; z-index: 2;">
    <div class="row justify-content-center mt-5">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-4">
                <div class="card-body text-center">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
                    <h2 class="card-title text-center mt-3 mb-1">Password Changed!</h2>
                    <p class="text-center mb-4" style="color: var(--navy-dark); font-size: 0.9rem;">
                        Your password has been successfully changed.
                    </p>
                    <hr>
                    <a href="{% url 'account_login' %}" class="btn btn-card w-100 mt-2">
                        Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
